# This file is a template, not the shipped metadata. The generateModMetadata task
# in neoforge/build.gradle expands the placeholders below from gradle.properties
# and writes the result to build/generated/sources/modMetadata, which is added to
# the resources source set.
#
# Because expansion uses Groovy's SimpleTemplateEngine, a literal dollar-brace
# anywhere in this file - even inside a comment - is parsed as an expression and
# breaks the build. Every placeholder here must name a key that build.gradle puts
# in replaceProperties. To change a value, edit gradle.properties.

modLoader = "javafml"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_sources}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
