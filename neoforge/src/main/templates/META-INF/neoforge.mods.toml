# This file is a template. `generateModMetadata` in neoforge/build.gradle expands
# every ${...} below from gradle.properties and writes the result to
# build/generated/sources/modMetadata, which is added to the resources source set.
# Edit gradle.properties to change any of these values - do not hardcode them here.

modLoader = "javafml"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_sources}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
