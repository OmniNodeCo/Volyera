name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The enchantment JSON, tags, lang file and the Java key constants are all
      # generated by tools/generate_enchantments.py. This fails the build if a
      # committed file no longer matches the roster, or if a file uses an effect
      # component, attribute, damage-type tag or mob effect that vanilla 26.2
      # does not define.
      - name: Validate generated data against the 26.2 vocabulary
        run: python3 tools/generate_enchantments.py --check

      # Independent of the generator: reads what is committed and cross-checks
      # lang coverage, tag references, treasure/curse bookkeeping and that every
      # exclusive-set conflict is declared in both directions.
      - name: Audit project consistency
        run: python3 tools/audit_project.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: ./gradlew build --stacktrace

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: Volyera-26.2
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
