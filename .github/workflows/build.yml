name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The enchantment JSON, tags, lang file and Java key constants are all
      # generated. This fails if a committed file no longer matches the roster,
      # or uses an effect component / attribute / tag / mob effect that vanilla
      # 26.2 does not define.
      - name: Validate generated data against the 26.2 vocabulary
        run: python3 tools/generate_enchantments.py --check

      # Reads what is committed rather than the in-memory roster, so it also
      # catches hand-edits.
      - name: Audit project consistency
        run: python3 tools/audit_project.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Each stage is run and logged independently so a failure in one does not
      # hide the state of the others. In particular this separates "Gradle or a
      # loader plugin could not be resolved" from "the Java did not compile",
      # which are the two things most likely to differ between the Fabric and
      # NeoForge halves of a two-loader project.
      - name: Build both loaders
        shell: bash
        run: |
          set -o pipefail
          status=0
          run_stage() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@" --console=plain 2>&1 | tee "build-$name.log"; then
              echo "STAGE $name: OK" | tee -a build-status.txt
            else
              echo "STAGE $name: FAILED" | tee -a build-status.txt
              status=1
            fi
            echo "::endgroup::"
          }
          : > build-status.txt
          run_stage versions ./gradlew --version
          run_stage projects ./gradlew projects
          run_stage neoforge ./gradlew :neoforge:build --stacktrace
          run_stage fabric   ./gradlew :fabric:build --stacktrace
          cat build-status.txt
          exit $status

      # Action log downloads are served from blob storage, which is not always
      # reachable from every environment. Mirroring the failure into a commit
      # comment keeps it retrievable through the plain REST API.
      #
      # With --stacktrace Gradle prints "What went wrong" first and then hundreds
      # of frames, so a plain tail only shows the stack. Extract the parts that
      # actually diagnose the problem instead.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Gradle build failed"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat build-status.txt 2>/dev/null
            echo '```'
            for f in build-*.log; do
              [ -f "$f" ] || continue
              echo
              echo "#### \`$f\`"
              echo
              echo '```'
              if grep -q "FAILURE: Build failed" "$f"; then
                sed -n '/FAILURE: Build failed/,/^\* Try:/p' "$f" | head -50
                echo "--- caused by ---"
                grep -h "Caused by" "$f" | head -8
                echo "--- compiler diagnostics ---"
                grep -hE "\.java:[0-9]+: (error|warning):|^e: |error: " "$f" | head -30
                echo "--- failed task ---"
                grep -hE "^> Task .* FAILED|Execution failed for task" "$f" | head -5
              else
                tail -n 40 "$f"
              fi
              echo '```'
            done
          } > /tmp/report.md
          wc -c /tmp/report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/report.md)" > /dev/null
          echo "Posted failure report as a commit comment on $GITHUB_SHA"

      # A green build only proves jars were produced. This proves they were
      # produced correctly: shared resources present in both, metadata templates
      # fully expanded, no loader's classes leaking into the other's jar, and
      # everything targeting Java 25.
      - name: Verify packaged jars
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_jars.py --markdown 2>&1 | tee jar-report.log

      # Artifacts are served from blob storage, which is not reachable from every
      # environment, so mirror the verification summary into a commit comment.
      - name: Report jar verification
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -s jar-report.log ]; then
            echo "no jar report to post"; exit 0
          fi
          {
            echo "### Packaged jar verification"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            sed -n '/<!-- markdown -->/,$p' jar-report.log | tail -n +2
          } > /tmp/jars.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/jars.md)" > /dev/null
          echo "Posted jar verification as a commit comment"

      - name: Upload mod jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Volyera-26.2
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error

  # A successful compile proves the Java is valid; it says nothing about whether
  # the game accepts the enchantment data. Several combinations Volyera uses are
  # not exercised by any vanilla enchantment - a level-scaled amplifier on
  # apply_mob_effect, apply_mob_effect and change_item_damage inside `tick`,
  # weather_check inside location_changed, and the 26.2 bounciness attribute -
  # so boot a real dedicated server and let Minecraft parse them.
  boot:
    name: Boot a 26.2 server and load the data
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start server, let it load, then stop it
        shell: bash
        run: |
          mkdir -p fabric/run
          echo 'eula=true' > fabric/run/eula.txt
          # Keep stdin open so the server console does not see EOF, then ask it
          # to stop once it has had time to finish loading.
          ( sleep 240; echo stop ) | timeout 420 \
            ./gradlew :fabric:runServer --console=plain > server.log 2>&1 || true
          echo "--- last 40 lines ---"
          tail -n 40 server.log

      - name: Check what the server said about Volyera
        shell: bash
        run: |
          if ! grep -q "Done (" server.log; then
            echo "server never finished starting; log follows"
            tail -n 200 server.log
            exit 1
          fi
          echo "server started cleanly"
          echo
          echo "--- mentions of volyera / enchantment ---"
          grep -inE "volyera|enchantment" server.log | head -60 || true
          echo
          # Anything of this shape means Minecraft rejected one of our files.
          if grep -qiE "failed to (load|parse)|couldn't (load|parse)|error while parsing|jsonsyntaxexception|invalid json|failed to parse|validation problem|missing required key|unknown .*(type|component|attribute|condition)|not a valid" server.log; then
            echo "DATA LOAD PROBLEMS DETECTED:"
            grep -inE "failed to (load|parse)|couldn't (load|parse)|error while parsing|jsonsyntaxexception|invalid json|failed to parse|validation problem|missing required key|unknown .*(type|component|attribute|condition)|not a valid" server.log | head -60
            exit 1
          fi
          echo "no data load errors reported"

      - name: Report boot result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Server boot check"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "The dedicated server reached \`Done (\` and logged no data load errors."
            else
              echo "The server did **not** finish starting, or reported data load errors."
            fi
            echo
            echo '```'
            grep -inE "volyera|enchantment" server.log 2>/dev/null | head -50 || echo "(no mentions)"
            echo '```'
          } > /tmp/boot.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/boot.md)" > /dev/null
