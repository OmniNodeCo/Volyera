name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The enchantment JSON, tags, lang file and Java key constants are all
      # generated, once per supported Minecraft version. This fails if a
      # committed file no longer matches the roster, or uses an effect component
      # / attribute / tag / mob effect that vanilla does not define.
      - name: Validate generated data against the vanilla vocabulary
        run: python3 tools/generate_enchantments.py --check

      # Reads what is committed rather than the in-memory roster, so it also
      # catches hand-edits.
      - name: Audit project consistency
        run: python3 tools/audit_project.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Each stage is run and logged independently so a failure in one does not
      # hide the state of the others. In particular this separates "Gradle or a
      # loader plugin could not be resolved" from "the Java did not compile",
      # which are the two things most likely to differ between the Fabric and
      # NeoForge halves of a two-loader project.
      - name: Build both loaders
        shell: bash
        run: |
          set -o pipefail
          status=0
          run_stage() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@" --console=plain 2>&1 | tee "build-$name.log"; then
              echo "STAGE $name: OK" | tee -a build-status.txt
            else
              echo "STAGE $name: FAILED" | tee -a build-status.txt
              status=1
            fi
            echo "::endgroup::"
          }
          : > build-status.txt
          run_stage versions ./gradlew --version
          run_stage projects ./gradlew projects

          # One invocation per loader x Minecraft version. The Fabric module is
          # built twice because 26.3 renamed the enchantment condition
          # discriminator, so the two versions need different data and cannot
          # share a jar; -Pminecraft_version selects the resource tree, the
          # Fabric API release and the artifact name together.
          #
          # NeoForge is built once: it has no stable 26.3, and settings.gradle
          # excludes the module entirely for that target.
          run_stage neoforge-26.2 ./gradlew :neoforge:build --stacktrace
          run_stage fabric-26.2   ./gradlew :fabric:build -Pminecraft_version=26.2 --stacktrace
          run_stage fabric-26.3   ./gradlew :fabric:build -Pminecraft_version=26.3 --stacktrace

          # Collect into one directory so the verification and upload steps see
          # exactly the deliverables, and so a jar missing because its stage
          # failed is obvious rather than hidden by a glob that matched nothing.
          mkdir -p dist
          cp fabric/build/libs/volyera-fabric-*.jar dist/ 2>/dev/null || true
          cp neoforge/build/libs/volyera-neoforge-*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar
          echo "--- deliverables ---"
          ls -l dist || true

          cat build-status.txt
          exit $status

      # Action log downloads are served from blob storage, which is not always
      # reachable from every environment. Mirroring the result into a commit
      # comment keeps it retrievable through the plain REST API.
      #
      # This runs whether or not the build succeeded, because a report step that
      # only runs on failure is a report step that can itself fail and leave
      # nothing behind - which is exactly what happened, twice. Every grep is
      # guarded with `|| true` because GitHub's default bash runs with
      # -o pipefail, so a grep that matches nothing inside a pipeline aborts the
      # step; the first version of this died that way and posted no report at
      # all, hiding the real error behind it.
      - name: Report build result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Gradle build result"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat build-status.txt 2>/dev/null || echo "(no stage status recorded)"
            echo '```'
            for f in build-*.log; do
              [ -f "$f" ] || continue
              echo
              echo "#### $f"
              echo
              echo '```'
              # With --stacktrace Gradle prints "What went wrong" first and then
              # hundreds of frames, so a plain tail only shows the stack. Take
              # the parts that diagnose the problem, and always keep a tail as a
              # fallback for failures that are not shaped like a Gradle error
              # (a settings-script problem, for instance, never gets that far).
              m=$(sed -n '/FAILURE: Build failed/,/^\* Try:/p' "$f" | head -40 || true)
              [ -n "$m" ] && echo "$m"
              m=$(grep -h "Caused by" "$f" | head -8 || true)
              [ -n "$m" ] && { echo "--- caused by ---"; echo "$m"; }
              m=$(grep -hE '\.java:[0-9]+: (error|warning):|^e: |error: ' "$f" | head -30 || true)
              [ -n "$m" ] && { echo "--- compiler diagnostics ---"; echo "$m"; }
              m=$(grep -hE '^> Task .* FAILED|Execution failed for task' "$f" | head -5 || true)
              [ -n "$m" ] && { echo "--- failed task ---"; echo "$m"; }
              m=$(grep -hE 'What went wrong|Could not|Exception|Cannot|Unknown|not found|No such' "$f" | head -25 || true)
              [ -n "$m" ] && { echo "--- likely cause ---"; echo "$m"; }
              echo "--- tail ---"
              tail -n 30 "$f" || true
              echo '```'
            done
            echo
            echo "#### deliverables"
            echo
            echo '```'
            ls -l dist 2>/dev/null || echo "(dist/ was not created)"
            echo '```'
          } > /tmp/report.md
          wc -c /tmp/report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/report.md)" > /dev/null
          echo "Posted build report as a commit comment on $GITHUB_SHA"

      # A green build only proves jars were produced. This proves they were
      # produced correctly: shared resources present in both, metadata templates
      # fully expanded, no loader's classes leaking into the other's jar, and
      # everything targeting Java 25.
      - name: Verify packaged jars
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/verify_jars.py --markdown dist/*.jar 2>&1 | tee jar-report.log

      # Artifacts are served from blob storage, which is not reachable from every
      # environment, so mirror the verification summary into a commit comment.
      - name: Report jar verification
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -s jar-report.log ]; then
            echo "no jar report to post"; exit 0
          fi
          {
            echo "### Packaged jar verification"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            sed -n '/<!-- markdown -->/,$p' jar-report.log | tail -n +2
          } > /tmp/jars.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/jars.md)" > /dev/null
          echo "Posted jar verification as a commit comment"

      - name: Upload mod jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Volyera-jars
          path: dist/*.jar
          if-no-files-found: error

  # A successful compile proves the Java is valid; it says nothing about whether
  # the game accepts the enchantment data, and "no errors in the log" is worth
  # nothing if the files were never read. This job exists because that is exactly
  # what happened: both jars shipped all 20 enchantment files, the server booted
  # cleanly, and yet not one enchantment was registered.
  #
  # So it drives a live 26.2 server console and asks it to put one of our
  # enchantments on an item, beside a minecraft:protection control. A probe only
  # counts if the item was summoned AND the component decoded with no
  # serialization error - an earlier version checked for the summon alone and
  # happily passed while Minecraft was logging "Failed to get element
  # volyera:warding" and dropping the enchantment.
  #
  # Three SNBT syntaxes are tried because 26.2 dropped the `levels:` wrapper.
  # If no syntax decodes even the vanilla control, the result is reported as
  # inconclusive and the job fails rather than quietly claiming success.
  #
  # Both loaders are booted: Fabric needs fabric-resource-loader-v1 for its data
  # to be read at all, while NeoForge loads mod data natively, and that
  # difference is precisely the kind of thing worth proving rather than assuming.
  boot:
    name: Boot a ${{ matrix.mc }} server (${{ matrix.loader }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # One leg per artifact that was built. There is no neoforge/26.3 leg
        # because NeoForge has no stable 26.3 release yet.
        include:
          - loader: fabric
            mc: '26.2'
          - loader: fabric
            mc: '26.3'
          - loader: neoforge
            mc: '26.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start server, probe the registry three ways, then stop it
        shell: bash
        run: |
          RUN_DIR="${{ matrix.loader }}/run"
          mkdir -p "$RUN_DIR"
          echo 'eula=true' > "$RUN_DIR/eula.txt"

          summon_cmd() { # tag, enchantment id, syntax variant
            local base='summon minecraft:item 0 100 0 {Tags:["%s"],Item:{id:"minecraft:diamond_chestplate",count:1,components:{%s}}}'
            case "$3" in
              flat)    printf "$base\n" "$1" "\"minecraft:enchantments\":{\"$2\":1}" ;;
              wrapped) printf "$base\n" "$1" "\"minecraft:enchantments\":{levels:{\"$2\":1}}" ;;
              byte)    printf "$base\n" "$1" "\"minecraft:enchantments\":{\"$2\":1b}" ;;
            esac
          }

          # The probe has to be typed into the *server's* console. Waiting a
          # fixed number of seconds does not work: NeoForge spends several
          # minutes downloading 137 artifacts before the JVM even exists, so an
          # earlier version fed every command to Gradle's stdin and the probe
          # silently measured nothing. Drive it from a FIFO instead and wait for
          # the log to say the server is up.
          mkfifo console.fifo
          # Read-write so the open does not block, and so the server's console
          # thread never sees EOF while we are still deciding what to send.
          exec 3<>console.fifo

          # --no-daemon matters: a Gradle daemon has no client stdin, so the
          # `standardInput = System.in` the NeoForge run task relies on would
          # still be empty. In the foreground System.in is the FIFO below.
          timeout 900 ./gradlew ":${{ matrix.loader }}:runServer" \
            -Pminecraft_version=${{ matrix.mc }} \
            --console=plain --no-daemon < console.fifo > server.log 2>&1 &
          gradle_pid=$!

          ready=no
          for _ in $(seq 1 180); do
            if grep -q "Done (" server.log 2>/dev/null; then ready=yes; break; fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then break; fi
            sleep 5
          done
          echo "server reached Done(: $ready"

          if [ "$ready" = yes ]; then
            for v in flat wrapped byte; do
              echo "say ---START-$v-CONTROL---" >&3
              summon_cmd "ctrl_$v" "minecraft:protection" "$v" >&3
              sleep 3
              echo "say ---START-$v-VOLYERA---" >&3
              summon_cmd "vol_$v" "volyera:warding" "$v" >&3
              sleep 3
              echo "say ---END-$v---" >&3
              sleep 1
            done
            echo 'say ---PROBE-DONE---' >&3
            sleep 2
            echo 'datapack list' >&3
            sleep 5
            echo stop >&3
          fi

          # Give it time to shut down on its own, then stop waiting on it.
          for _ in $(seq 1 24); do
            kill -0 "$gradle_pid" 2>/dev/null || break
            sleep 5
          done
          kill "$gradle_pid" 2>/dev/null || true
          wait "$gradle_pid" 2>/dev/null || true
          exec 3>&- || true
          echo "--- tail of server.log ---"
          tail -n 20 server.log || true

      # Analyse, publish, then assert - in that order, so the evidence is always
      # posted even when the check fails. GitHub's default bash runs with
      # -o pipefail, so a grep that finds nothing aborts the step; every grep
      # here is guarded.
      - name: Analyse the server log
        shell: bash
        run: |
          LOADER="${{ matrix.loader }}"
          ERRORS='Failed to load data pack|Error while parsing|JsonSyntaxException|Failed to parse|Found validation problem|Missing required key|Unknown registry element|Registry .* reported an error'
          DECODE_BAD='Serialization error|Failed to decode|Not a number|Unknown enchantment|Failed to get element|Invalid|Expected'

          started=no
          grep -q "Done (" server.log && started=yes || true

          section() {
            awk -v a="$1" -v b="$2" 'index($0,a){f=1;next} index($0,b){f=0} f' server.log
          }
          probe_ok() {
            printf '%s' "$1" | grep -q "Summoned new" || return 1
            if printf '%s' "$1" | grep -qiE "$DECODE_BAD"; then return 1; fi
            return 0
          }

          any_control=no
          rows=""
          raw=""
          for v in flat wrapped byte; do
            c=$(section "---START-$v-CONTROL---" "---START-$v-VOLYERA---")
            y=$(section "---START-$v-VOLYERA---" "---END-$v---")
            c_ok=no; y_ok=no
            probe_ok "$c" && c_ok=yes || true
            probe_ok "$y" && y_ok=yes || true
            [ "$c_ok" = yes ] && any_control=yes || true
            rows="$rows| \`$v\` | $c_ok | $y_ok |
          "
            raw="$raw--- $v / control ---
          $c
          --- $v / volyera ---
          $y
          "
            eval "ctrl_$v=\$c_ok"
            eval "vol_$v=\$y_ok"
          done

          error_lines=$(grep -inE "$ERRORS" server.log | head -40 || true)
          error_count=$(printf '%s' "$error_lines" | grep -c . || true)
          mod_lines=$(grep -nE "^[[:space:]]*-[[:space:]]+[a-z]" server.log | head -40 || true)
          loader_lines=$(grep -inE "volyera|resource-loader|resource_loader" server.log | head -25 || true)
          datapack_lines=$(grep -inE "data ?pack" server.log | head -20 || true)
          registry_lines=$(grep -oE "volyera:[a-z_]+" server.log | sort -u | head -30 || true)
          warn_lines=$(grep -inE "/(WARN|ERROR)]" server.log | head -40 || true)

          {
            echo "### Server boot check - $LOADER, Minecraft ${{ matrix.mc }}"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ "$started" = yes ]; then
              echo "Dedicated server reached \`Done (\` - it loaded every registry and datapack."
              grep -m1 "Done (" server.log | sed 's/^/\n    /' || true
            else
              echo "**The server never finished starting.**"
            fi
            echo
            echo "#### Registry probe"
            echo
            echo "Each row asked the live server to summon a chestplate wearing an"
            echo "enchantment. A probe passes only if the item was summoned *and* its"
            echo "component decoded with no serialization error."
            echo
            echo "| item component SNBT | \`minecraft:protection\` (control) | \`volyera:warding\` |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
            echo
            if [ "$any_control" = yes ]; then
              echo "At least one syntax decoded the vanilla control cleanly, so the"
              echo "matching Volyera column is a real result."
            else
              echo "**No syntax decoded even the vanilla control**, so these rows say"
              echo "nothing about Volyera. The item component SNBT has probably moved"
              echo "again and the probe needs updating."
            fi
            echo
            echo "<details><summary>raw probe output</summary>"
            echo
            echo '```'
            printf '%s' "$raw"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "#### Mods and resource loaders in the log"
            echo
            echo '```'
            echo "${loader_lines:-(no mentions)}"
            echo '```'
            echo
            echo "<details><summary>mod list as logged at startup</summary>"
            echo
            echo '```'
            echo "${mod_lines:-(not logged)}"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "#### Volyera ids seen anywhere in the log"
            echo
            echo '```'
            echo "${registry_lines:-(none)}"
            echo '```'
            echo
            echo "#### Datapack report"
            echo
            echo '```'
            echo "${datapack_lines:-(nothing logged)}"
            echo '```'
            echo
            echo "#### Data load errors (count: $error_count)"
            echo
            echo '```'
            echo "${error_lines:-(none)}"
            echo '```'
            echo
            echo "#### Warnings and errors in the log"
            echo
            echo '```'
            echo "${warn_lines:-(none)}"
            echo '```'
          } > boot-report.md

          echo "$started" > started.txt
          echo "$error_count" > error-count.txt
          echo "$any_control" > any-control.txt
          { echo "$ctrl_flat $vol_flat"; echo "$ctrl_wrapped $vol_wrapped"; echo "$ctrl_byte $vol_byte"; } > probe-results.txt
          cat boot-report.md

      - name: Report boot result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat boot-report.md)" > /dev/null
          echo "Posted boot report"

      - name: Fail if the data did not load
        shell: bash
        run: |
          started=$(cat started.txt || echo no)
          errors=$(cat error-count.txt || echo 0)
          any_control=$(cat any-control.txt || echo no)

          [ "$started" = yes ] || { echo "server did not reach Done ("; exit 1; }
          [ "$errors" = "0" ] || { echo "$errors data load error line(s)"; exit 1; }

          proven=no
          rejected=no
          while read -r c y; do
            [ -n "$c" ] || continue
            if [ "$c" = yes ] && [ "$y" = yes ]; then proven=yes; fi
            if [ "$c" = yes ] && [ "$y" != yes ]; then rejected=yes; fi
          done < probe-results.txt

          if [ "$rejected" = yes ]; then
            echo "A syntax decoded vanilla minecraft:protection cleanly but rejected"
            echo "volyera:warding - the enchantment is not in the registry at runtime."
            exit 1
          fi
          if [ "$proven" = yes ]; then
            echo "PROVEN: a live ${{ matrix.mc }} ${{ matrix.loader }} server put volyera:warding on an"
            echo "item, decoding it exactly as it decoded the vanilla control."
            exit 0
          fi
          if [ "$any_control" != yes ]; then
            echo "INCONCLUSIVE: no candidate SNBT decoded even the vanilla control, so"
            echo "the probe cannot speak for Volyera. Boot and data-load checks passed."
            exit 1
          fi
          echo "INCONCLUSIVE: probe produced no clean result."
          exit 1
