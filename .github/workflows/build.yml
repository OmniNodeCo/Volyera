# Volyera CI — copy this file to .github/workflows/build.yml to enable it.
# (Automation tokens can't push workflow files, so this lives in ci/ as a reference.)
#
# Builds on every push / PR, can be run manually (workflow_dispatch), and on
# pushes it commits the built jar back into dist/ so the latest jar is always
# downloadable straight from the repo.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Volyera
          path: build/libs/
      - name: commit jar to dist
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || {
            git commit -m "ci: update dist jar [skip ci]"
            git push
          }
