# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom is not fully configuration-cache compatible yet.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Minecraft / toolchain
# ---------------------------------------------------------------------------
# Minecraft 26.2 "Chaos Cubed". Requires Java 25 at runtime and at build time.
# Minecraft is *unobfuscated* from 26.1 onwards, so there are no mappings to
# declare: both loaders compile against Mojang's own names, which is what lets
# `common/` be shared verbatim between Fabric and NeoForge.
minecraft_version=26.2
minecraft_version_range=[26.2]
java_version=25

# ---------------------------------------------------------------------------
# NeoForge  -  https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
# The NeoForge version must agree with minecraft_version above.
neo_version=26.2.0.87
moddev_version=2.0.147

# ---------------------------------------------------------------------------
# Fabric  -  https://fabricmc.net/develop
# ---------------------------------------------------------------------------
fabric_loader_version=0.19.5
loom_version=1.17-SNAPSHOT
# Fabric API is REQUIRED on Fabric, and not for any API it exposes: it is
# fabric-resource-loader-v1 that registers a mod's data/ folder with the game's
# pack repository. Fabric Loader contains no pack-repository code at all, so
# without this module the enchantment JSON ships inside the jar and is simply
# never read - the server boots cleanly, /datapack list shows only vanilla, and
# the enchantment registry stays empty. Verified on a live 26.2 server: with no
# resource loader, summoning an item wearing volyera:warding failed with
# "Failed to get element volyera:warding" while the vanilla control succeeded.
#
# Loom resolves the individual module version from this Fabric API version's
# published POM, so only the one module is pulled in, not all of Fabric API.
fabric_api_version=0.160.0+26.2

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
mod_id=volyera
mod_name=Volyera
mod_version=1.0.0
mod_license=MIT
mod_authors=Volyera contributors
mod_group=net.volyera
mod_description=Adds a set of data-driven armour enchantments - elemental wards, mobility boons and two curses - for Minecraft 26.2 on Fabric and NeoForge.
mod_sources=https://github.com/OmniNodeCo/Volyera
mod_issues=https://github.com/OmniNodeCo/Volyera/issues
