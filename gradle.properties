# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom is not fully configuration-cache compatible yet.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Minecraft / toolchain
# ---------------------------------------------------------------------------
# Minecraft 26.2 "Chaos Cubed". Requires Java 25 at runtime and at build time.
# Minecraft is *unobfuscated* from 26.1 onwards, so there are no mappings to
# declare: both loaders compile against Mojang's own names, which is what lets
# `common/` be shared verbatim between Fabric and NeoForge.
minecraft_version=26.2
minecraft_version_range=[26.2]
java_version=25

# ---------------------------------------------------------------------------
# NeoForge  -  https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
# The NeoForge version must agree with minecraft_version above.
neo_version=26.2.0.87
moddev_version=2.0.147

# ---------------------------------------------------------------------------
# Fabric  -  https://fabricmc.net/develop
# ---------------------------------------------------------------------------
fabric_loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
mod_id=volyera
mod_name=Volyera
mod_version=1.0.0
mod_license=MIT
mod_authors=Volyera contributors
mod_group=net.volyera
mod_description=Adds a set of data-driven armour enchantments - elemental wards, mobility boons and two curses - for Minecraft 26.2 on Fabric and NeoForge.
mod_sources=https://github.com/OmniNodeCo/Volyera
mod_issues=https://github.com/OmniNodeCo/Volyera/issues
