# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom is not fully configuration-cache compatible yet.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Minecraft / toolchain
# ---------------------------------------------------------------------------
# The version THIS build targets. CI overrides it once per artifact:
#
#   ./gradlew :fabric:build  -Pminecraft_version=26.2
#   ./gradlew :fabric:build  -Pminecraft_version=26.3
#   ./gradlew :neoforge:build                      (26.2, the default)
#
# Everything version-specific below is keyed by this value.
minecraft_version=26.2

# Every version Volyera supports. Used by the tools and by CI to enumerate
# builds; the loader modules themselves work out what they can target from the
# per-version keys below.
supported_minecraft_versions=26.2,26.3

# Minecraft is *unobfuscated* from 26.1 onwards, so there are no mappings to
# declare: both loaders compile against Mojang's own names, which is what lets
# `common/` be shared verbatim between them. Both 26.2 and 26.3 need Java 25.
java_version=25

# 26.3 is a breaking data-format release for enchantments: the condition
# discriminator was renamed from "condition" to "type", and damage-source tag
# references gained a "#" prefix. Neither version's codec accepts the other's
# spelling, so one jar cannot serve both. tools/generate_enchantments.py emits
# the 20 definitions once per version into common/src/mc<version>/resources,
# from a single source of truth; everything else - tags, translations, Java - is
# byte-identical across versions and stays in common/src/main/resources.

# ---------------------------------------------------------------------------
# NeoForge  -  https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
moddev_version=2.0.147

# One neo_version_<major>_<minor> key per Minecraft version NeoForge has a
# *stable* release for. settings.gradle excludes the :neoforge module entirely
# when the targeted version has no entry here, so a Fabric-only version does not
# leave a module that cannot configure itself.
#
# There is deliberately no neo_version_26_3. NeoForge 26.3 exists only as
# 26.3.0.1-beta - the official MDK-26.3 pins that, and the 26.3.0 tag has no
# -stable counterpart the way 26.1.2 and 26.2.0 both do. Volyera ships 26.3 on
# Fabric until NeoForge promotes a stable build; add the key here and the module
# comes back with no other change.
neo_version_26_2=26.2.0.87

# ---------------------------------------------------------------------------
# Fabric  -  https://fabricmc.net/develop
# ---------------------------------------------------------------------------
# Loader and Loom are not per-Minecraft-version: 0.19.5 satisfies both (Fabric
# API's own 26.3 build asks for 0.19.3), and loom_version is a snapshot that
# tracks the 1.17 line, which covers the 1.17.20 that 26.3 needs.
fabric_loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Fabric API releases ARE per-Minecraft-version. Loom reads the named release's
# published POM to resolve fabric-resource-loader-v1's own module version, so
# only that one module is pulled in rather than all of Fabric API.
fabric_api_version_26_2=0.160.0+26.2
fabric_api_version_26_3=0.160.6+26.3

# Fabric API is REQUIRED on Fabric, and not for any API it exposes: it is
# fabric-resource-loader-v1 that registers a mod's data/ folder with the game's
# pack repository. Fabric Loader contains no pack-repository code at all, so
# without this module the enchantment JSON ships inside the jar and is simply
# never read - the server boots cleanly, /datapack list shows only vanilla, and
# the enchantment registry stays empty. That was a real bug here, caught by the
# CI boot probe: summoning an item wearing volyera:warding failed with "Failed
# to get element volyera:warding" while the vanilla control succeeded. NeoForge
# treats every mod jar as a resource pack natively and needs no equivalent.

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
mod_id=volyera
mod_name=Volyera
mod_version=1.0.0
mod_license=MIT
mod_authors=Volyera contributors
mod_group=net.volyera
mod_description=Adds a set of data-driven armour enchantments - elemental wards, mobility boons and two curses - for Minecraft 26.2 and 26.3.
mod_sources=https://github.com/OmniNodeCo/Volyera
mod_issues=https://github.com/OmniNodeCo/Volyera/issues
