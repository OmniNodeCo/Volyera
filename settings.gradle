pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
    }
}

plugins {
    // Lets Gradle auto-provision the Java 25 toolchain Minecraft 26.2 needs.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Volyera'

// Two loader modules. The loader-agnostic sources and all of the mod's data
// live in `common/`, which is *not* a Gradle project: both modules compile and
// package it directly (see the root build.gradle). Because Minecraft ships
// unobfuscated from 26.1 onwards, the same Java sources are valid for both
// loaders with no remapping step.
include 'fabric'

// The data is *not* valid for every Minecraft version, though: 26.3 renamed the
// enchantment condition discriminator, so each version gets its own resource
// tree and the target is chosen by -Pminecraft_version (see gradle.properties).
//
// :neoforge is included only when NeoForge has a stable release for the targeted
// version. Excluding the project here, rather than failing inside its build
// script, is what lets `./gradlew build -Pminecraft_version=26.3` work at all:
// Gradle configures every included project, so a module that cannot configure
// itself would break a build that never asked for it.
// Read the properties directly rather than through the Settings provider API:
// this runs before any project exists, and -Pminecraft_version has to override
// gradle.properties exactly the way it will for the projects themselves.
def volyeraProps = new Properties()
def propsFile = new File(settingsDir, 'gradle.properties')
if (propsFile.isFile()) {
    propsFile.withInputStream { volyeraProps.load(it) }
}
def mcVersion = gradle.startParameter.projectProperties['minecraft_version'] ?:
        volyeraProps.getProperty('minecraft_version', '26.2')
def neoKey = 'neo_version_' + mcVersion.replace('.', '_')
def neoVersion = gradle.startParameter.projectProperties[neoKey] ?:
        volyeraProps.getProperty(neoKey)
if (neoVersion) {
    include 'neoforge'
} else {
    println "Volyera: NeoForge has no stable release for Minecraft ${mcVersion}, " +
            "so :neoforge is excluded from this build (no ${neoKey} in " +
            "gradle.properties). Fabric only."
}
